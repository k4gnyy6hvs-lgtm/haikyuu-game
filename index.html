wake:{scene:"bedroom",lines:[["旁白","天花板很高，中央懸著一盞水晶燈。窗簾是厚重的米色布料，晨光從縫隙裡漏進來。"],["旁白","床墊軟得不像話。你盯著陌生的吊燈，第一個念頭竟然是：這房間打掃起來應該很麻煩。"],["旁白","下一秒，你才意識到不對。"],["旁白","這裡不是你的房間。"],["？？？","小姐，您醒了嗎？"],["旁白","門外傳來三下克制的敲門聲。"],["？？？","早餐已經準備好了。老爺希望您今天能準時下樓。"],["旁白","床頭一支陌生的手機震動起來。螢幕亮了一瞬。"],["手機訊息","「妳昨天說的那些話，是認真的嗎？」"],["旁白","寄件人只顯示一個沒有存入通訊錄的號碼。門外的人似乎還在等待。"]],choices:[["先假裝沒事，回應門外的人。","door"],["先查看手機訊息與日期。","phone"],["下床找鏡子，確認自己的樣貌。","mirror"],["直接問：「這裡是哪裡？」","question"]]},

mirror:{scene:"mirror",lines:[["旁白","赤腳踩上地毯時，你幾乎沒有聽見自己的腳步聲。"],["旁白","梳妝台上擺著昂貴的保養品、幾支髮夾，以及一張沒有署名的拍立得。"],["旁白","你站到鏡子前。"],["旁白","鏡中的少女與你有幾分相似，卻絕對不是你原本的樣子。"],["旁白","你伸手碰了碰自己的臉。鏡中的人做了相同的動作。"],["旁白","一陣寒意慢慢爬上背脊。這不是惡作劇能解釋的事。"]],choices:[["檢查梳妝台上的拍立得。","photo"],["先冷靜，翻找能證明身分的東西。","identity"],["回應門外的人，避免引起懷疑。","door"]]},

let node="start",idx=0,history=[],flags={},voice=false,finished=false;
const $=id=>document.getElementById(id);
function toast(s){$("toast").textContent=s;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1800)}
function render(){let s=story[node];$("scene").className="scene "+s.scene;$("choices").style.display="none";$("dialogue").style.display="block";$("chapter").style.opacity=node==="start"?"1":".5";let line=s.lines[idx];$("speaker").textContent=line[0]==="旁白"?"":line[0];$("text").textContent=line[1];$("hint").textContent=idx===s.lines.length-1&&s.choices?"選擇行動 ▸":s.end&&idx===s.lines.length-1?"試玩章節結束":"點擊繼續 ▸";if(voice&&line[0]!=="旁白")speak(line[1]);}
function speak(t){if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="zh-TW";u.rate=.94;window.speechSynthesis.speak(u)}
function next(){let s=story[node];if(idx<s.lines.length-1){idx++;history.push(s.lines[idx]);render();return}if(s.choices){$("dialogue").style.display="none";$("choices").style.display="flex";$("choices").innerHTML="";s.choices.forEach((c,i)=>{let b=document.createElement("button");let a=document.createElement("span");a.textContent=String.fromCharCode(65+i)+".";b.append(a,document.createTextNode(c[0]));b.onclick=()=>choose(c[1]);$("choices").append(b)})}else if(s.to){choose(s.to)}else if(s.end){toast("序章試玩已完成，可存檔或重新體驗其他分支")}}
function choose(n){flags[n]=(flags[n]||0)+1;node=n;idx=0;history.push(story[n].lines[0]);render()}
function save(){localStorage.setItem("anotherSpringSave",JSON.stringify({node,idx,history,flags}));toast("已儲存至此瀏覽器")}
function load(){let x=localStorage.getItem("anotherSpringSave");if(!x){toast("尚無存檔");return}try{let a=JSON.parse(x);if(!story[a.node])throw Error();node=a.node;idx=a.idx;history=a.history||[];flags=a.flags||{};render();toast("讀檔成功")}catch(e){toast("存檔讀取失敗")}}
function restart(){if(confirm("確定要從序章重新開始？（已儲存的存檔不受影響）")){node="start";idx=0;history=[story.start.lines[0]];flags={};render()}}
function toggleVoice(){voice=!voice;$("voiceBtn").textContent="語音："+(voice?"開":"關");if(!voice&&"speechSynthesis"in window)speechSynthesis.cancel();toast(voice?"使用裝置內建中文朗讀（非角色聲優）":"語音已關閉")}
function showLog(){$("logPanel").style.display="block";$("logContent").innerHTML="<h2>對話紀錄</h2>";history.forEach(l=>{let p=document.createElement("p");p.textContent=(l[0]==="旁白"?"":l[0]+"：")+l[1];$("logContent").append(p)})}
function hideLog(){$("logPanel").style.display="none"}
history=[story.start.lines[0]];render();
</script></body></html>
