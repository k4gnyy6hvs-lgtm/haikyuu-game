wake:{scene:"bedroom",lines:[["旁白","天花板很高，中央懸著一盞水晶燈。窗簾是厚重的米色布料，晨光從縫隙裡漏進來。"],["旁白","床墊軟得不像話。你盯著陌生的吊燈，第一個念頭竟然是：這房間打掃起來應該很麻煩。"],["旁白","下一秒，你才意識到不對。"],["旁白","這裡不是你的房間。"],["？？？","小姐，您醒了嗎？"],["旁白","門外傳來三下克制的敲門聲。"],["？？？","早餐已經準備好了。老爺希望您今天能準時下樓。"],["旁白","床頭一支陌生的手機震動起來。螢幕亮了一瞬。"],["手機訊息","「妳昨天說的那些話，是認真的嗎？」"],["旁白","寄件人只顯示一個沒有存入通訊錄的號碼。門外的人似乎還在等待。"]],choices:[["先假裝沒事，回應門外的人。","door"],["先查看手機訊息與日期。","phone"],["下床找鏡子，確認自己的樣貌。","mirror"],["直接問：「這裡是哪裡？」","question"]]},

let node='start',idx=0,history=[],flags={},voice=false,started=false;
const el=id=>document.getElementById(id);function toast(s){el('toast').textContent=s;el('toast').style.display='block';setTimeout(()=>el('toast').style.display='none',2100)}
function render(){let s=story[node];if(!s)return;let scene=({'breakfast':'dining','hall':'bedroom','mirror':'bedroom','memory':'bedroom','phone':'bedroom'})[s.scene]||s.scene;el('bg').style.backgroundImage=`url("${ASSETS[scene+'.svg']}")`;el('chapter').textContent=s.chapter||({'start':'序章 · 醒來之前','wake':'序章 · 陌生的房間'})[node]||'序章 · 陌生的房間';let l=s.lines[idx];el('speaker').textContent=l[0]==='旁白'?'':l[0];el('words').textContent=l[1];el('hint').textContent=idx===s.lines.length-1&&s.choices?'選擇行動 ▸':s.end&&idx===s.lines.length-1?'篇章結束':'點擊繼續 ▸';el('progress').style.width=((idx+1)/s.lines.length*100)+'%';el('choices').style.display='none';el('dialogue').style.display='block';let src=portraits[l[0]];if(src){el('portrait').src=ASSETS[src];el('portrait').className=''}else{el('portrait').className='hidden'}if(voice&&l[0]!=='旁白')speak(l[1]);}
function speak(t){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.95;window.speechSynthesis.speak(u)}
function nextLine(){let s=story[node];if(idx<s.lines.length-1){idx++;history.push(s.lines[idx]);render();return}if(s.choices){el('dialogue').style.display='none';el('choices').style.display='flex';el('choices').innerHTML='';s.choices.forEach((c,i)=>{let b=document.createElement('button');b.textContent=String.fromCharCode(65+i)+'.  '+c[0];b.onclick=()=>go(c[1]);el('choices').appendChild(b)})}else if(s.to)go(s.to);else if(s.end)toast('目前篇章結束，記得存檔！')}
function go(n){flags[n]=(flags[n]||0)+1;node=n;idx=0;history.push(story[n].lines[0]);render()}
function begin(){started=true;el('start').style.display='none';node='start';idx=0;history=[story.start.lines[0]];flags={};render()}
function saveGame(){if(!started){toast('請先開始遊戲');return}localStorage.setItem('anotherSpringV2',JSON.stringify({node,idx,history,flags}));toast('已存檔在目前瀏覽器')}
function loadGame(){let raw=localStorage.getItem('anotherSpringV2');if(!raw){toast('還沒有存檔');return}try{let x=JSON.parse(raw);if(!story[x.node])throw Error();node=x.node;idx=x.idx;history=x.history||[];flags=x.flags||{};started=true;el('start').style.display='none';render();toast('讀檔成功')}catch(e){toast('存檔損壞，無法讀取')}}
function restart(){if(confirm('重新開始？原本存檔不會被刪除。'))begin()}
function toggleVoice(){voice=!voice;el('voiceBtn').textContent=voice?'朗讀 ON':'朗讀 OFF';if(!voice&&'speechSynthesis'in window)speechSynthesis.cancel();toast(voice?'使用裝置內建中文語音朗讀':'已關閉朗讀')}
function showLog(){el('modal').style.display='block';el('logContent').innerHTML='';history.forEach(l=>{let p=document.createElement('p');p.textContent=(l[0]==='旁白'?'':l[0]+'：')+l[1];el('logContent').appendChild(p)})}
function closeLog(){el('modal').style.display='none'}
</script></body></html>
